name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ${{ github.repository }}/backend
  IMAGE_FRONTEND: ${{ github.repository }}/frontend
  IMAGE_WORKER: ${{ github.repository }}/worker

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install lint dependencies
      run: python -m pip install -r backend/requirements-dev.txt
    - run: ruff check backend/ worker/
    - run: black --check backend/ worker/

  test-backend:
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - run: |
        cd backend
        python -m pip install -r requirements-dev.txt
        pytest tests/ --cov=. --cov-report=xml:coverage.xml --cov-report=html
    - uses: codecov/codecov-action@v4
      with:
        files: ./backend/coverage.xml

  test-frontend:
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    - run: |
        cd frontend
        npm ci
        npm test

  build:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    steps:
    - uses: actions/checkout@v4
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Build images locally first (--load) so Trivy can scan them
    - name: Build backend image
      run: |
        docker buildx build --platform linux/amd64 --load \
          -t $REGISTRY/$IMAGE_BACKEND:main \
          -f Dockerfile.backend .

    - name: Build frontend image
      run: |
        docker buildx build --platform linux/amd64 --load \
          -t $REGISTRY/$IMAGE_FRONTEND:main \
          -f frontend/Dockerfile ./frontend

    - name: Build worker image
      run: |
        docker buildx build --platform linux/amd64 --load \
          -t $REGISTRY/$IMAGE_WORKER:main \
          -f Dockerfile.worker .

    # ── Trivy: Scan built images before pushing ───────────────────
    - name: Trivy scan — backend image
      uses: aquasecurity/trivy-action@0.28.0
      with:
        image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:main
        format: table
        severity: CRITICAL,HIGH
        exit-code: "0"
        trivyignores: .trivyignore

    - name: Trivy scan — frontend image
      uses: aquasecurity/trivy-action@0.28.0
      with:
        image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:main
        format: table
        severity: CRITICAL,HIGH
        exit-code: "0"
        trivyignores: .trivyignore

    - name: Trivy scan — worker image
      uses: aquasecurity/trivy-action@0.28.0
      with:
        image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_WORKER }}:main
        format: table
        severity: CRITICAL,HIGH
        exit-code: "0"
        trivyignores: .trivyignore

    # ── Trivy: Upload SARIF results to GitHub Security tab ────────
    - name: Trivy SARIF — backend image
      uses: aquasecurity/trivy-action@0.28.0
      if: always()
      with:
        image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:main
        format: sarif
        output: trivy-backend.sarif
        severity: CRITICAL,HIGH
        exit-code: "0"
        trivyignores: .trivyignore

    - name: Trivy SARIF — frontend image
      uses: aquasecurity/trivy-action@0.28.0
      if: always()
      with:
        image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:main
        format: sarif
        output: trivy-frontend.sarif
        severity: CRITICAL,HIGH
        exit-code: "0"
        trivyignores: .trivyignore

    - name: Trivy SARIF — worker image
      uses: aquasecurity/trivy-action@0.28.0
      if: always()
      with:
        image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_WORKER }}:main
        format: sarif
        output: trivy-worker.sarif
        severity: CRITICAL,HIGH
        exit-code: "0"
        trivyignores: .trivyignore

    - name: Upload SARIF results
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: .
        category: trivy-images

    # ── Push images to registry ───────────────────────────────────
    - name: Push images to GHCR
      run: |
        docker push $REGISTRY/$IMAGE_BACKEND:main
        docker push $REGISTRY/$IMAGE_FRONTEND:main
        docker push $REGISTRY/$IMAGE_WORKER:main

  sonar:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: sonarsource/sonarqube-scan-action@v1
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
